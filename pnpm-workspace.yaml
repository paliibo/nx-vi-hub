# Build scripts are opt-in. Only packages that genuinely need a post-install
# step are allowed to run one; everything else installs from its published
# artifacts, which keeps `pnpm install` fast and reproducible on CI.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  # Ships prebuilt binaries for every platform we target, so no node-gyp.
  argon2: true
  nx: true
  prisma: true
  core-js: false
  core-js-pure: false
  fsevents: false
  nice-napi: false
  "@parcel/watcher": true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - webpack-cli@7.2.3
  - webpack@5.110.1
